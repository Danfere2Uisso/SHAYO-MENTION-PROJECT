<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 84" width="100%" height="100%">
  <defs>
    <linearGradient id="rkSunburstGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#EE1C25"/>
      <stop offset="28%" stop-color="#E51E2B"/>
      <stop offset="44%" stop-color="#A51878"/>
      <stop offset="50%" stop-color="#7A128B"/>
      <stop offset="56%" stop-color="#4E1A96"/>
      <stop offset="72%" stop-color="#002B99"/>
      <stop offset="100%" stop-color="#0033A0"/>
    </linearGradient>
    <linearGradient id="rkRingGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#EE1C25"/>
      <stop offset="48%" stop-color="#7A128B"/>
      <stop offset="100%" stop-color="#0033A0"/>
    </linearGradient>
    <filter id="rkLogoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#020617" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="translate(42, 42) scale(0.2)">
    <g transform="translate(-200, -200)">
<g filter="url(#rkLogoShadow)">
    <!-- 32 Alternating Straight & Wavy Flame Rays -->
    <g transform="translate(200, 200)" fill="url(#rkSunburstGradient)">
    <path d="M -9.5,-104 L 0,-196 L 9.5,-104 Z" transform="rotate(0.00)" />
    <path d="M -8.5,-104 C -14,-122 -4,-140 -12,-158 C -8,-168 -4,-174 0,-182 C 4,-174 8,-168 12,-158 C 4,-140 14,-122 8.5,-104 Z" transform="rotate(11.25)" />
    <path d="M -8.5,-104 L 0,-188 L 8.5,-104 Z" transform="rotate(22.50)" />
