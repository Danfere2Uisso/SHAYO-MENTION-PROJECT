    <path d="M -8.5,-104 L 0,-188 L 8.5,-104 Z" transform="rotate(337.50)" />
    <path d="M -8.5,-104 C -14,-122 -4,-140 -12,-158 C -8,-168 -4,-174 0,-182 C 4,-174 8,-168 12,-158 C 4,-140 14,-122 8.5,-104 Z" transform="rotate(348.75)" />
    </g>

    <!-- Circular Outer Gradient Band/Ring (Red top, Purple sides, Blue bottom) -->
    <circle cx="200" cy="200" r="104" fill="url(#rkRingGradient)" />

    <!-- Pure White Center Disc -->
    <circle cx="200" cy="200" r="88" fill="#FFFFFF" />

    <!-- UPPER SECTION: The Iconic "RK" Monogram -->
    <g transform="translate(200, 154)" text-anchor="middle">
      <!-- Letter 'R' in Deep Royal Blue (#0033A0) -->
      <path d="M -48,-32 L -20,-32 C -7,-32 0,-24 0,-13 C 0,-4 -6,3 -18,4 L -5,30 L -21,30 L -32,7 L -34,7 L -34,30 L -48,30 Z M -34,-18 L -34,-4 L -20,-4 C -13,-4 -9,-7 -9,-11 C -9,-15 -13,-18 -20,-18 Z" fill="#0033A0" />

      <!-- Letter 'K' in Vibrant Flame Red (#EE1C25) -->
      <path d="M -9,-32 L 6,-32 L 6,-8 L 26,-32 L 44,-32 L 20,-3 L 45,30 L 27,30 L 8,5 L 6,7 L 6,30 L -9,30 Z" fill="#EE1C25" />

      <!-- Horizontal Red/Blue Accent Bar with "RADIO KWIZERA" -->
      <rect x="-30" y="-8" width="58" height="15" rx="3" fill="#0033A0" />
      <text x="-1" y="3.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="900" fill="#FFFFFF" letter-spacing="0.6">RADIO KWIZERA</text>
    </g>

    <!-- LOWER SECTION: Jesuit Refugee Service (JRS Tanzania) -->
    <g transform="translate(200, 226)">
      <!-- Protective Light Cyan Swoosh Arc (#00A3E0) -->
      <path d="M -66,-10 C -42,-28 12,-30 46,-12" fill="none" stroke="#00A3E0" stroke-width="3.5" stroke-linecap="round" />

      <!-- 3 Human Figures / Refugees Holding Hands in Blue (#0033A0) -->
      <!-- Left figure (child) -->
      <circle cx="-56" cy="-4" r="3.2" fill="#0033A0" />
      <path d="M -56,-0.5 L -56,12 M -56,4 L -62,10 M -56,4 L -47,1 M -56,12 L -60,22 M -56,12 L -52,22" fill="none" stroke="#0033A0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Center figure (adult) -->
      <circle cx="-42" cy="-9" r="3.8" fill="#0033A0" />
      <path d="M -42,-5 L -42,11 M -42,0 L -48,2 M -42,0 L -33,0 M -42,11 L -46,23 M -42,11 L -38,23" fill="none" stroke="#0033A0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Right figure (adult) -->
      <circle cx="-27" cy="-7" r="3.5" fill="#0033A0" />
      <path d="M -27,-3.5 L -27,11 M -27,1 L -33,0 M -27,1 L -20,7 M -27,11 L -31,23 M -27,11 L -23,23" fill="none" stroke="#0033A0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Bold "JRS" Acronym -->
      <text x="12" y="7" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="900" fill="#002B99" letter-spacing="-0.5">JRS</text>

      <!-- Subtitle: "JESUIT REFUGEE SERVICE" -->
      <text x="2" y="16" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5" font-weight="800" fill="#0033A0" letter-spacing="0.6">JESUIT REFUGEE SERVICE</text>

      <!-- Vertical Divider Line -->
      <line x1="48" y1="-10" x2="48" y2="18" stroke="#00A3E0" stroke-width="1.8" stroke-linecap="round" />

      <!-- "TANZANIA" Text -->
      <text x="52" y="5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="800" fill="#00A3E0" letter-spacing="0.8">TANZANIA</text>
    </g>
  </g>

    </g>
  </g>

  <g transform="translate(90, 18)">
    <text x="0" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Montserrat, Arial, sans-serif" font-size="25" font-weight="900" fill="#0A192F" letter-spacing="1.2">RADIO KWIZERA</text>
    <g transform="translate(0, 36)">
      <rect x="0" y="-10" width="56" height="15" rx="3.5" fill="#EE1C25"/>
      <text x="6" y="1" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">97.9 FM</text>
      <text x="64" y="1" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#0033A0" letter-spacing="0.8">RK JRS • NGARA</text>
