    <path d="M -8.5,-104 L 0,-188 L 8.5,-104 Z" transform="rotate(67.50)" />
    <path d="M -8.5,-104 C -14,-122 -4,-140 -12,-158 C -8,-168 -4,-174 0,-182 C 4,-174 8,-168 12,-158 C 4,-140 14,-122 8.5,-104 Z" transform="rotate(78.75)" />
    <path d="M -9.5,-104 L 0,-196 L 9.5,-104 Z" transform="rotate(90.00)" />
