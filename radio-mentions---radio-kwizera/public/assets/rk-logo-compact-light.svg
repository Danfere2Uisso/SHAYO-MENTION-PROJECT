    <path d="M -8.5,-104 L 0,-188 L 8.5,-104 Z" transform="rotate(157.50)" />
    <path d="M -8.5,-104 C -14,-122 -4,-140 -12,-158 C -8,-168 -4,-174 0,-182 C 4,-174 8,-168 12,-158 C 4,-140 14,-122 8.5,-104 Z" transform="rotate(168.75)" />
    <path d="M -9.5,-104 L 0,-196 L 9.5,-104 Z" transform="rotate(180.00)" />
    <path d="M -8.5,-104 C -14,-122 -4,-140 -12,-158 C -8,-168 -4,-174 0,-182 C 4,-174 8,-168 12,-158 C 4,-140 14,-122 8.5,-104 Z" transform="rotate(191.25)" />
    <path d="M -8.5,-104 L 0,-188 L 8.5,-104 Z" transform="rotate(202.50)" />
    <path d="M -8.5,-104 C -14,-122 -4,-140 -12,-158 C -8,-168 -4,-174 0,-182 C 4,-174 8,-168 12,-158 C 4,-140 14,-122 8.5,-104 Z" transform="rotate(213.75)" />
    <path d="M -8.5,-104 L 0,-188 L 8.5,-104 Z" transform="rotate(225.00)" />
    <path d="M -8.5,-104 C -14,-122 -4,-140 -12,-158 C -8,-168 -4,-174 0,-182 C 4,-174 8,-168 12,-158 C 4,-140 14,-122 8.5,-104 Z" transform="rotate(236.25)" />
    <path d="M -8.5,-104 L 0,-188 L 8.5,-104 Z" transform="rotate(247.50)" />
    <path d="M -8.5,-104 C -14,-122 -4,-140 -12,-158 C -8,-168 -4,-174 0,-182 C 4,-174 8,-168 12,-158 C 4,-140 14,-122 8.5,-104 Z" transform="rotate(258.75)" />
    <path d="M -9.5,-104 L 0,-196 L 9.5,-104 Z" transform="rotate(270.00)" />
    <path d="M -8.5,-104 C -14,-122 -4,-140 -12,-158 C -8,-168 -4,-174 0,-182 C 4,-174 8,-168 12,-158 C 4,-140 14,-122 8.5,-104 Z" transform="rotate(281.25)" />
    <path d="M -8.5,-104 L 0,-188 L 8.5,-104 Z" transform="rotate(292.50)" />
    <path d="M -8.5,-104 C -14,-122 -4,-140 -12,-158 C -8,-168 -4,-174 0,-182 C 4,-174 8,-168 12,-158 C 4,-140 14,-122 8.5,-104 Z" transform="rotate(303.75)" />
    <path d="M -8.5,-104 L 0,-188 L 8.5,-104 Z" transform="rotate(315.00)" />
